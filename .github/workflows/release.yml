name: Build & Release

# Builds the debug APK, the signed release APK and the AAB on every push, then publishes them
# as a GitHub release (tag v* pushes use the tag itself, everything else lands on v1.0.0).
on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under"
        default: "v1.0.0"
        type: string
      publish:
        description: "Publish a GitHub release"
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: morse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: "1.0.0"

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platforms and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          # android-23 is what the app compiles against so an old device can never hit a
          # missing symbol; the offline builder needs the jar for its second compile pass.
          sdkmanager --install "platforms;android-23" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # ---------------------------------------------------------------- primary build
      - name: Build with Gradle (debug APK, release APK, AAB)
        id: gradle
        continue-on-error: true
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleRelease :app:bundleRelease

      # ---------------------------------------------------------------- fallback build
      # The Gradle path needs the Android Gradle Plugin from Google Maven. If that is
      # unreachable, the repository's own Gradle-free toolchain builds the same three files.
      - name: Build with the offline toolchain (fallback)
        if: steps.gradle.outcome == 'failure'
        run: |
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          export MC_DEXER=d8
          python3 tools/offline_build.py \
            --jdk "$JAVA_HOME" \
            --kotlinc /tmp/kotlin/kotlinc/bin/kotlinc \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
            --aapt2 "$ANDROID_HOME/build-tools/34.0.0/aapt2" \
            --platforms "$ANDROID_HOME/platforms"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp -v app/build/outputs/apk/debug/*.apk "out/MorseCode-${VERSION}-debug.apk" 2>/dev/null || true
          cp -v app/build/outputs/apk/release/*.apk "out/MorseCode-${VERSION}-release.apk" 2>/dev/null || true
          cp -v app/build/outputs/bundle/release/*.aab "out/MorseCode-${VERSION}.aab" 2>/dev/null || true
          # the offline builder writes dist/ directly
          if [ -f "dist/MorseCode-${VERSION}-debug.apk" ]; then cp -v dist/MorseCode-*.apk dist/MorseCode-*.aab out/; fi
          ls -la out
          test -n "$(ls -A out)" || { echo "::error::no artifacts were produced"; exit 1; }

      - name: Verify the signed release APK
        run: |
          APK=$(ls out/MorseCode-*-release.apk | head -1)
          java -jar "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -3

      - name: Checksums
        run: |
          cd out && sha256sum *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF}" = "refs/tags/" ] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v${VERSION}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "### MorseCode ${VERSION}"
            echo ""
            echo "Offline, peer-to-peer file transfer for Android — LAN, Nearby, Broadcast and WebShare."
            echo ""
            echo "| File | What it is |"
            echo "|------|------------|"
            echo "| \`MorseCode-${VERSION}-release.apk\` | signed release build (v1 + v2 signatures) |"
            echo "| \`MorseCode-${VERSION}-debug.apk\` | debug build for testing |"
            echo "| \`MorseCode-${VERSION}.aab\` | Android App Bundle for Play |"
            echo "| \`SHA256SUMS.txt\` | checksums |"
            echo ""
            echo "**Install:** \`adb install -r MorseCode-${VERSION}-release.apk\`"
            echo ""
            echo "minSdk 21 · targetSdk 34 · applicationId \`com.morsecode.app\` · built from \`${GITHUB_SHA:0:7}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MorseCode-${{ env.VERSION }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MorseCode ${{ steps.meta.outputs.tag }}
          body: ${{ steps.meta.outputs.notes }}
          files: out/*
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
