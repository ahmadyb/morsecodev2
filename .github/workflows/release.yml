name: Build & Release

# Builds the debug APK, the signed release APK and the AAB, installs the release on a real
# Android emulator and drives it through all four tabs, and only then publishes a release.
# A build that cannot open is never published.

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Defaults to v<version>."
        required: false
      publish:
        description: "Publish a GitHub release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEFAULT_VERSION: "1.0.1"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -d "$RUNNER_TEMP/cmdline-tools/latest" ]; then
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
          fi
          mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest" 2>/dev/null || true
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-23" "platforms;android-34" \
            "build-tools;$ANDROID_BUILD_TOOLS" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            VER="${VER#v}"
          else
            VER="$DEFAULT_VERSION"
          fi
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cannot derive a version from '$VER'"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "MC_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "MC_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "versionName=$VER versionCode=$CODE"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build with Gradle (debug APK, release APK, AAB)
        id: gradle
        run: |
          set +e
          gradle --no-daemon assembleDebug assembleRelease bundleRelease 2>&1 | tee /tmp/gradle.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            grep -E "^(e: |.*error: |FAILURE|Execution failed|Caused by)" /tmp/gradle.log | sort -u | head -60 | while IFS= read -r line; do
              echo "::error title=gradle::${line:0:800}"
            done
            echo "gradle_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Build with the offline toolchain (fallback)
        if: steps.gradle.outputs.gradle_failed == 'true'
        run: |
          set -euo pipefail
          echo "::warning title=fallback::Gradle failed - building with the offline toolchain"
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q /tmp/kotlin.zip -d /tmp
          export KOTLINC_PATH=/tmp/kotlinc/bin/kotlinc
          export JAVA_OPTS="-Xmx3g -XX:MaxMetaspaceSize=768m"
          if ! python3 tools/offline_build.py > /tmp/offline.log 2>&1; then
            tail -40 /tmp/offline.log | while IFS= read -r line; do
              line="${line//$'\r'/}"
              echo "::error title=offline-build::${line:0:800}"
            done
            exit 1
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.name }}"
          mkdir -p out
          cp -v app/build/outputs/apk/debug/*.apk "out/MorseCode-${V}-debug.apk" 2>/dev/null || true
          cp -v app/build/outputs/apk/release/*.apk "out/MorseCode-${V}-release.apk" 2>/dev/null || true
          cp -v app/build/outputs/bundle/release/*.aab "out/MorseCode-${V}.aab" 2>/dev/null || true
          # the offline builder writes dist/ directly
          if [ -f "dist/MorseCode-${V}-release.apk" ]; then
            cp -v "dist/MorseCode-${V}-debug.apk" "dist/MorseCode-${V}-release.apk" "dist/MorseCode-${V}.aab" out/
          fi
          ls -la out
          test -f "out/MorseCode-${V}-release.apk" || { echo "::error::no release APK was produced"; exit 1; }

          # The bundle is what Play consumes, so check its required pieces before publishing.
          python3 -c "
          import sys, zipfile
          p = 'out/MorseCode-${V}.aab'
          names = zipfile.ZipFile(p).namelist()
          need = ['base/manifest/AndroidManifest.xml', 'BundleConfig.pb']
          missing = [n for n in need if n not in names]
          if not any(n.startswith('base/dex/') and n.endswith('.dex') for n in names):
              missing.append('base/dex/*.dex')
          if missing:
              print('::error::the AAB is missing ' + ', '.join(missing)); sys.exit(1)
          print('AAB ok: %d entries' % len(names))
          "

      - name: Verify the signed release APK
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.name }}"
          APK="out/MorseCode-${V}-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/lib/apksigner.jar"
          java -jar "$SIGNER" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2" dump badging "$APK" | head -3
          CERT=$(java -jar "$SIGNER" verify --print-certs "$APK" | grep "Signer #1 certificate DN" | cut -d: -f2- | xargs)
          SCHEMES=$(java -jar "$SIGNER" verify -v "$APK" | grep -E "Verified using v[0-9] scheme" | xargs | tr '\n' ' ')
          SIZE=$(stat -c%s "$APK")
          echo "::notice title=signed release APK::${CERT:-no signer} | ${SCHEMES:-no scheme info} | ${SIZE} bytes"

      - name: Checksums
        run: |
          cd out && sha256sum *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MorseCode-${{ steps.ver.outputs.name }}
          path: out/*
          if-no-files-found: error

  smoke:
    name: Install and drive the app on an emulator
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: MorseCode-${{ needs.build.outputs.version }}
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The release APK is the artifact users install, so the test installs and drives exactly
      # that file. A crash on launch fails the job and blocks the release.
      - name: Install and drive the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/emulator_smoke.sh "${{ needs.build.outputs.version }}"

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MorseCode-screenshots
          path: screenshots/**
          if-no-files-found: warn

      # The screenshots are the evidence that the published APK opens and that the UI matches
      # the approved designs, so they belong next to the source rather than in a job artifact
      # that expires. `[skip ci]` keeps this from starting another run.
      - name: Commit the screenshots
        if: always() && github.ref_type == 'branch' && hashFiles('screenshots/*.png') != ''
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p docs/screenshots
          cp screenshots/*.png docs/screenshots/
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
          else
            git commit -m "ci: emulator screenshots from run ${GITHUB_RUN_ID} [skip ci]"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

  release:
    name: Publish GitHub release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: MorseCode-${{ needs.build.outputs.version }}
          path: out

      - name: Point the tag at this commit
        run: |
          set -euo pipefail
          TAG="${{ needs.build.outputs.tag }}"
          test -f "out/MorseCode-${{ needs.build.outputs.version }}-release.apk" \
            || { echo "::error::nothing to publish"; exit 1; }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          echo "::notice::${TAG} points at $GITHUB_SHA"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MorseCode ${{ needs.build.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: out/*
          body: |
            ### MorseCode ${{ needs.build.outputs.version }}

            Offline, peer-to-peer file transfer for Android — LAN, Nearby, Broadcast and WebShare.

            | File | What it is |
            |------|------------|
            | `MorseCode-${{ needs.build.outputs.version }}-release.apk` | signed release build (v1 + v2 signatures) |
            | `MorseCode-${{ needs.build.outputs.version }}-debug.apk` | debug build for testing |
            | `MorseCode-${{ needs.build.outputs.version }}.aab` | Android App Bundle for Play |
            | `SHA256SUMS.txt` | checksums |

            **Install:** `adb install -r MorseCode-${{ needs.build.outputs.version }}-release.apk`

            This build was installed and driven through all four tabs on an Android 14 (API 34)
            emulator before publishing — the screenshots are the `MorseCode-screenshots` workflow
            artifact.

            Built from `${{ github.sha }}` · versionCode `${{ needs.build.outputs.code }}` ·
            minSdk 21 · targetSdk 34 · applicationId `com.morsecode.app`
